name: Build and Publish Windows App

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $graphics.Clear([System.Drawing.Color]::FromArgb(13, 15, 20))
            $purple = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(139, 92, 246))
            $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
            $dark = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(13, 15, 20))
            $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::White, 13)
            try {
              $graphics.FillRoundedRectangle($purple, 18, 18, 220, 220, 48)
            } catch {
              $graphics.FillRectangle($purple, 18, 18, 220, 220)
            }
            $graphics.FillEllipse($white, 61, 91, 134, 88)
            $graphics.FillEllipse($dark, 82, 115, 18, 48)
            $graphics.FillEllipse($dark, 68, 130, 46, 18)
            $graphics.FillEllipse($purple, 148, 112, 17, 17)
            $graphics.FillEllipse($purple, 171, 135, 17, 17)
            $handle = $bitmap.GetHicon()
            try {
              $icon = [System.Drawing.Icon]::FromHandle($handle)
              $stream = [System.IO.File]::Create("$env:GITHUB_WORKSPACE/Assets/GameLibraryLogo.ico")
              try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }
            } finally {
              [void][System.Runtime.InteropServices.Marshal]::DestroyIcon($handle)
            }
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }

      - name: Restore
        run: dotnet restore GameLibrary.csproj

      - name: Build
        run: dotnet build GameLibrary.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >
          dotnet publish GameLibrary.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish

      - name: Upload Windows executable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Game-Library-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
