name: Build and Publish Windows App

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile("$env:GITHUB_WORKSPACE/Assets/GameLibraryLogo.jpg")
          try {
            $bitmap = New-Object System.Drawing.Bitmap(256, 256)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::Transparent)
              $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $scale = [Math]::Min(256.0 / $source.Width, 256.0 / $source.Height)
              $width = [int]($source.Width * $scale)
              $height = [int]($source.Height * $scale)
              $x = [int]((256 - $width) / 2)
              $y = [int]((256 - $height) / 2)
              $graphics.DrawImage($source, $x, $y, $width, $height)
              $handle = $bitmap.GetHicon()
              try {
                $icon = [System.Drawing.Icon]::FromHandle($handle)
                $stream = [System.IO.File]::Create("$env:GITHUB_WORKSPACE/Assets/GameLibraryLogo.ico")
                try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }
              } finally {
                [void][System.Runtime.InteropServices.Marshal]::DestroyIcon($handle)
              }
            } finally { $graphics.Dispose(); $bitmap.Dispose() }
          } finally { $source.Dispose() }

      - name: Restore
        run: dotnet restore GameLibrary.csproj

      - name: Build
        run: dotnet build GameLibrary.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >
          dotnet publish GameLibrary.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish

      - name: Upload Windows executable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Game-Library-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
